; Пресеты экспорта Godot 4.7.2. Поддерживает агент ci-build, см. docs/BUILD.md.
; Godot при сохранении из редактора перепишет файл и допишет недостающие опции
; значениями по умолчанию — это нормально, порядок и имена пресетов менять нельзя:
; CI ссылается на них по имени ("Linux", "iOS", "macOS").
;
; iOS: application/app_store_team_id специально пустой. В CI его подставляет
; .github/workflows/build.yml (secret IOS_TEAM_ID, без него — заглушка для
; неподписанной сборки). Локально впишите свой Team ID в редакторе, но не коммитьте.
; Ориентация (только landscape) задаётся не здесь, а в project.godot:
; display/window/handheld/orientation=4 (sensor_landscape).

[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="gdextension/*, tests/*, docs/*, *.md, build/*, .github/*"
export_path="build/linux/Physics.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
shader_baker/enabled=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

